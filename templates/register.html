<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — LHP AKPOL</title>
<link rel="icon" href="/static/logo_akpol.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img src="/static/logo_akpol.png" alt=""> LHP AKPOL</div>
      <div class="right"><a href="/login">Masuk</a></div>
    </div>
  </header>

  <div class="wrap-narrow">
    <div class="card">
      <h2>Buat akun</h2>
      <p class="muted">Akun hanya dipakai untuk mencatat pemakaian. Tidak ada token dan tidak ada biaya.</p>

      {% if error %}<div class="notice notice-error">{{ error }}</div>{% endif %}

      <form method="post" action="/register">
        <label for="nama">Nama lengkap</label>
        <input type="text" id="nama" name="nama" required autocomplete="name">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               autocapitalize="off" autocomplete="username" minlength="3">
        <div class="muted" id="username-hint" style="margin-top:5px; min-height:18px;"></div>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6"
               autocomplete="new-password">
        <div class="muted" style="margin-top:5px;">Minimal 6 karakter.</div>

        <label for="confirm">Ulangi password</label>
        <input type="password" id="confirm" name="confirm" required minlength="6"
               autocomplete="new-password">

        <div style="margin-top:22px;">
          <button class="btn btn-primary btn-block" type="submit">Buat akun</button>
        </div>
      </form>
    </div>
  </div>

<script>
const uInput = document.getElementById('username');
const hint = document.getElementById('username-hint');
let timer;
uInput.addEventListener('input', () => {
  clearTimeout(timer);
  const val = uInput.value.trim();
  if (val.length < 3) { hint.textContent = ''; return; }
  timer = setTimeout(async () => {
    try {
      const res = await fetch('/check-username?username=' + encodeURIComponent(val));
      const data = await res.json();
      hint.textContent = data.available
        ? 'Username tersedia.'
        : 'Username sudah dipakai. Pilih yang lain.';
      hint.style.color = data.available ? '#1A7F4B' : '#9E1B22';
    } catch { hint.textContent = ''; }
  }, 400);
});
</script>
</body>
</html>
