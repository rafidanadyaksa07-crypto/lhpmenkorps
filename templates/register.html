<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat akun — LHP AKPOL</title>
<link rel="icon" href="/static/logo_akpol.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-bar">
    <span class="wordmark"><img src="/static/logo_akpol.png" alt=""> LHP Akpol</span>
    <nav><a href="/login">Masuk</a></nav>
  </div>
</header>

<div class="sheet-narrow" style="padding-top:40px;">
  <div class="panel">
    <h2 class="panel-title">Buat akun</h2>
    <p class="note" style="margin-bottom:20px;">
      Akun dipakai untuk mencatat siapa yang menyusun laporan. Tidak ada biaya
      dan tidak ada batas pemakaian.
    </p>

    {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="/register" id="reg-form" novalidate>
      <label for="nama">Nama lengkap <span class="req">*</span></label>
      <input type="text" id="nama" name="nama" required autocomplete="name">

      <label for="username">Nama pengguna <span class="req">*</span></label>
      <input type="text" id="username" name="username" required minlength="3"
             autocapitalize="off" autocomplete="username" spellcheck="false">
      <div class="note" id="username-hint" style="margin-top:6px; min-height:20px;">
        Tiga karakter atau lebih. Huruf, angka, titik, dan garis bawah.
      </div>

      <label for="password">Kata sandi <span class="req">*</span></label>
      <input type="password" id="password" name="password" required minlength="6"
             autocomplete="new-password">
      <div class="pw-meter" aria-hidden="true">
        <span class="pw-seg" id="seg1"></span>
        <span class="pw-seg" id="seg2"></span>
        <span class="pw-seg" id="seg3"></span>
      </div>
      <div class="note" id="pw-hint" style="margin-top:6px; min-height:20px;">
        Enam karakter atau lebih.
      </div>

      <label for="confirm">Ulangi kata sandi <span class="req">*</span></label>
      <input type="password" id="confirm" name="confirm" required minlength="6"
             autocomplete="new-password">
      <div class="note" id="confirm-hint" style="margin-top:6px; min-height:20px;"></div>

      <div style="margin-top:24px;">
        <button class="btn btn-solid btn-wide" type="submit" id="reg-btn">Buat akun</button>
      </div>
    </form>

    <p class="note" style="text-align:center; margin:18px 0 0;">
      Sudah punya akun? <a href="/login">Masuk</a>
    </p>
  </div>
</div>

<script>
const username = document.getElementById('username');
const uHint = document.getElementById('username-hint');
const pw = document.getElementById('password');
const pwHint = document.getElementById('pw-hint');
const confirmEl = document.getElementById('confirm');
const cHint = document.getElementById('confirm-hint');
const segs = [1,2,3].map(i => document.getElementById('seg'+i));
let timer;

username.addEventListener('input', () => {
  clearTimeout(timer);
  const v = username.value.trim();
  if (v.length < 3) {
    uHint.textContent = 'Tiga karakter atau lebih.';
    uHint.style.color = '';
    return;
  }
  uHint.textContent = 'Memeriksa ketersediaan...';
  uHint.style.color = '';
  timer = setTimeout(async () => {
    try {
      const res = await fetch('/check-username?username=' + encodeURIComponent(v));
      const d = await res.json();
      uHint.textContent = d.available
        ? 'Nama pengguna ini tersedia.'
        : 'Sudah dipakai. Pilih nama lain.';
      uHint.style.color = d.available ? '#145236' : '#A31621';
    } catch { uHint.textContent = ''; }
  }, 400);
});

const score = v => {
  let s = 0;
  if (v.length >= 6) s++;
  if (v.length >= 10) s++;
  if (/[0-9]/.test(v) && /[a-zA-Z]/.test(v)) s++;
  return Math.min(s, 3);
};

pw.addEventListener('input', () => {
  const v = pw.value, s = score(v);
  const cls = ['', 'on-weak', 'on-ok', 'on-strong'][s];
  segs.forEach((seg, i) => seg.className = 'pw-seg' + (i < s && cls ? ' ' + cls : ''));
  if (!v)                { pwHint.textContent = 'Enam karakter atau lebih.'; pwHint.style.color = ''; }
  else if (v.length < 6) { pwHint.textContent = 'Masih terlalu pendek.';     pwHint.style.color = '#A31621'; }
  else                   { pwHint.textContent = ['', 'Cukup.', 'Baik.', 'Kuat.'][s]; pwHint.style.color = ''; }
  checkMatch();
});

function checkMatch() {
  if (!confirmEl.value) { cHint.textContent = ''; return true; }
  const ok = confirmEl.value === pw.value;
  cHint.textContent = ok ? 'Cocok.' : 'Belum cocok dengan kata sandi di atas.';
  cHint.style.color = ok ? '#145236' : '#A31621';
  return ok;
}
confirmEl.addEventListener('input', checkMatch);

document.getElementById('reg-form').addEventListener('submit', e => {
  const bad = [];
  if (!document.getElementById('nama').value.trim()) bad.push('nama');
  if (username.value.trim().length < 3) bad.push('username');
  if (pw.value.length < 6) bad.push('password');
  if (pw.value !== confirmEl.value) bad.push('confirm');
  if (bad.length) {
    e.preventDefault();
    checkMatch();
    document.getElementById(bad[0]).focus();
    return;
  }
  const b = document.getElementById('reg-btn');
  b.disabled = true;
  b.innerHTML = '<span class="spinner"></span>Membuat akun';
});
</script>
</body>
</html>
