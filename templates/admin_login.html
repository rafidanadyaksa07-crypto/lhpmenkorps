<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengelola — LHP AKPOL</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-bar">
    <span class="wordmark">
        <img class="crest" src="/static/logo_menkorps.png" alt="">
        <img class="crest crest-side" src="/static/logo_akpol.png" alt="">
        LHP Akpol
      </span>
    <nav><a href="/login">Halaman taruna</a></nav>
  </div>
</header>

<div class="sheet-narrow" style="padding-top:56px;">
  <div class="panel">
    <h2 class="panel-title">Masuk sebagai pengelola</h2>
    <p class="note" style="margin-bottom:20px;">
      Halaman ini menampilkan daftar akun dan catatan pemakaian.
    </p>

    {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="/login-admin">
      <label for="username">Nama pengguna</label>
      <input type="text" id="username" name="username" required autocapitalize="off">

      <label for="password">Kata sandi</label>
      <input type="password" id="password" name="password" required>

      <div style="margin-top:26px;">
        <button class="btn btn-solid btn-wide" type="submit">Masuk</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
