<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk admin — LHP AKPOL</title>
<link rel="icon" href="/static/logo_akpol.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img src="/static/logo_akpol.png" alt=""> LHP AKPOL</div>
      <div class="right"><a href="/login">Halaman taruna</a></div>
    </div>
  </header>

  <div class="wrap-narrow">
    <div class="card">
      <h2>Masuk sebagai admin</h2>
      <p class="muted">Panel ini menampilkan daftar akun dan catatan pemakaian.</p>

      {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}

      <form method="post" action="/login-admin" id="admin-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocapitalize="off" autofocus>

        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" required>
          <button type="button" class="pw-toggle" data-target="password"
                  aria-label="Tampilkan password">Lihat</button>
        </div>

        <div style="margin-top:22px;">
          <button class="btn btn-primary btn-block" type="submit" id="admin-btn">Masuk</button>
        </div>
      </form>
    </div>
  </div>

<script>
document.querySelectorAll('.pw-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Sembunyikan' : 'Lihat';
    input.focus();
  });
});
document.getElementById('admin-form').addEventListener('submit', () => {
  const b = document.getElementById('admin-btn');
  b.disabled = true;
  b.innerHTML = '<span class="spinner"></span>Masuk';
});
</script>
</body>
</html>
