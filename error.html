<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — LHP AKPOL</title>
<link rel="icon" href="/static/logo_akpol.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img src="/static/logo_akpol.png" alt=""> LHP AKPOL</div>
    </div>
  </header>

  <div class="wrap-narrow" style="text-align:center; padding-top:64px;">
    <div class="errcode">{{ code }}</div>
    <h1 style="margin-bottom:8px;">{{ title }}</h1>
    <p class="muted" style="margin-bottom:26px;">{{ message }}</p>
    <a class="btn btn-primary" href="{{ back_url }}">{{ back_label }}</a>
  </div>
</body>
</html>
